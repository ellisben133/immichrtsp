services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: immich-rtsp-mediamtx
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.3
    environment:
      # Default readTimeout/writeTimeout (10s) was killing the publisher
      # connection well before anything was actually wrong with it.
      MTX_READTIMEOUT: 60s
      MTX_WRITETIMEOUT: 60s
    ports:
      - "8554:8554/tcp"
      - "8554:8554/udp"

  immich-rtsp:
    image: immich-rtsp:latest
    pull_policy: never
    container_name: immich-rtsp
    restart: unless-stopped
    depends_on:
      - mediamtx
    # Hard caps so this can never again threaten whatever else is running
    # on the host, regardless of what goes wrong -- after the first version
    # OOM'd a 2 CPU / 4GB shared container by keeping every photo open as
    # a simultaneous live ffmpeg input. The new render-then-stream design
    # (see app.py) shouldn't need anywhere near this much, but a hard
    # ceiling costs nothing and means a future bug fails loudly (OOM-killed
    # container, visible in logs) instead of starving the whole host.
    mem_limit: 768m
    cpus: 1.0
    environment:
      IMMICH_SERVER_URL: ${IMMICH_SERVER_URL}
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      IMMICH_ALBUM_NAMES: ${IMMICH_ALBUM_NAMES:-Family,Vacation}
      PHOTO_COUNT: ${PHOTO_COUNT:-20}
      LANDSCAPE_ONLY: ${LANDSCAPE_ONLY:-true}
      SECONDS_PER_IMAGE: ${SECONDS_PER_IMAGE:-15}
      FADE_SECONDS: ${FADE_SECONDS:-1.5}
      REFRESH_INTERVAL_HOURS: ${REFRESH_INTERVAL_HOURS:-24}
      RTSP_PUBLISH_URL: ${RTSP_PUBLISH_URL:-rtsp://mediamtx:8554/wallpaper}
      WIDTH: ${WIDTH:-1920}
      HEIGHT: ${HEIGHT:-1080}
    volumes:
      - immich_rtsp_data:/data

volumes:
  immich_rtsp_data:
